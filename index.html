<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Z-Score Recovery Screener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />

    <style>
        /* Updated CSS Variables for Dark Mode - NO OTHER CHANGES MADE */
        :root {
            --bg:          #05070a;
            --bg2:         #0f172a;
            --surface:     #0f172a;
            --surface2:    #1e293b;
            --border:      #1e293b;
            --border2:     #334155;
            --text:        #f8fafc;
            --text2:       #94a3b8;
            --text3:       #64748b;
            --green:       #10b981;
            --green-bg:    rgba(16, 185, 129, 0.1);
            --green-mid:   #059669;
            --red:         #ef4444;
            --red-bg:      rgba(239, 68, 68, 0.1);
            --amber:       #f59e0b;
            --amber-bg:    rgba(245, 158, 11, 0.1);
            --blue:        #3b82f6;
            --blue-bg:     rgba(59, 130, 246, 0.1);
            
            --font-serif:  'Libre Baskerville', Georgia, serif;
            --font-mono:   'IBM Plex Mono', 'Courier New', monospace;
            --font-sans:   'DM Sans', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); font-family: var(--font-sans); line-height: 1.5; -webkit-font-smoothing: antialiased; }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        header { margin-bottom: 3rem; border-bottom: 1px solid var(--border); padding-bottom: 2rem; }
        .logo-area { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 0.5rem; }
        h1 { font-family: var(--font-serif); font-size: 2.25rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
        .subtitle { font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text3); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; border-radius: 4px; transition: all 0.2s ease; }
        .stat-label { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3); margin-bottom: 0.5rem; display: block; }
        .stat-value { font-family: var(--font-serif); font-size: 1.5rem; font-weight: 700; color: var(--text); }
        .stat-value.positive { color: var(--green); }
        
        .controls { background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; border-radius: 4px; margin-bottom: 2rem; display: flex; flex-wrap: wrap; gap: 2rem; align-items: flex-end; }
        .control-group { display: flex; flex-direction: column; gap: 0.5rem; }
        label { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; color: var(--text3); }
        input { background: var(--bg); border: 1px solid var(--border2); color: var(--text); padding: 0.6rem 0.8rem; font-family: var(--font-mono); font-size: 0.875rem; border-radius: 2px; width: 100px; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: var(--blue); }
        
        .table-container { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
        .table-scroll { overflow-x: auto; max-height: 800px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: var(--surface2); padding: 1rem; font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; color: var(--text3); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
        td { padding: 1rem; font-size: 0.875rem; border-bottom: 1px solid var(--border); }
        tr:hover td { background-color: var(--surface2); }
        
        .ticker { font-weight: 700; color: var(--text); }
        .mono { font-family: var(--font-mono); }
        .pill { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 2px; font-family: var(--font-mono); font-size: 0.7rem; font-weight: 600; }
        .pill-green { background: var(--green-bg); color: var(--green); }
        .pill-red { background: var(--red-bg); color: var(--red); }
        
        #loading-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; transition: opacity 0.4s ease; }
        .loader { width: 40px; height: 40px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="loader"></div>
        <p class="subtitle">Accessing Terminal...</p>
    </div>

    <div class="container">
        <header>
            <div class="logo-area">
                <h1>Z-Score</h1>
                <span id="scan-timestamp" class="subtitle">Initializing...</span>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Total Signals</span>
                <span id="total-count" class="stat-value">--</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Average Gain</span>
                <span id="avg-gain" class="stat-value positive">--</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Best Performer</span>
                <span id="best-performer" class="stat-value">--</span>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Min Z-Score</label>
                <input type="number" id="z-min" value="-3" step="0.1" />
            </div>
            <div class="control-group">
                <label>RS Rating Filter</label>
                <input type="number" id="rs-min" value="0" />
            </div>
        </div>

        <div class="table-container">
            <div class="table-scroll">
                <table id="screener-table">
                    <thead>
                        <tr>
                            <th>Ticker</th>
                            <th>Price</th>
                            <th>Z-Score</th>
                            <th>RS Rating</th>
                            <th>Vol %</th>
                            <th>50MA</th>
                            <th>200MA</th>
                            <th>1Y High</th>
                            <th>1Y Low</th>
                            <th>Dist High</th>
                            <th>Gain %</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        const tableBody = document.getElementById('table-body');
        const zMinInput = document.getElementById('z-min');
        const rsMinInput = document.getElementById('rs-min');

        async function loadData() {
            try {
                const response = await fetch(`data/screener_results.json?t=${Date.now()}`);
                const data = await response.json();
                allData = data.results || [];
                
                document.getElementById('scan-timestamp').textContent = `Pulse: ${data.metadata.scan_timestamp}`;
                applyFilters();
                
                setTimeout(() => {
                    document.getElementById('loading-overlay').style.opacity = '0';
                    setTimeout(() => document.getElementById('loading-overlay').remove(), 400);
                }, 500);
            } catch (error) {
                console.error('Data Error:', error);
            }
        }

        function applyFilters() {
            const zMin = parseFloat(zMinInput.value);
            const rsMin = parseFloat(rsMinInput.value);

            const filtered = allData.filter(d => 
                d.z_score >= zMin && (d.rs_rating || 0) >= rsMin
            );

            updateStats(filtered);
            renderTable(filtered);
        }

        function updateStats(data) {
            document.getElementById('total-count').textContent = data.length;
            if (data.length > 0) {
                const avgGain = data.reduce((acc, curr) => acc + (curr.gain_pct || 0), 0) / data.length;
                document.getElementById('avg-gain').textContent = `${avgGain.toFixed(2)}%`;
                
                const best = [...data].sort((a, b) => (b.gain_pct || 0) - (a.gain_pct || 0))[0];
                document.getElementById('best-performer').textContent = best.ticker;
            }
        }

        function renderTable(data) {
            tableBody.innerHTML = data.map(d => `
                <tr>
                    <td><span class="ticker">${d.ticker}</span></td>
                    <td class="mono">$${d.price.toFixed(2)}</td>
                    <td class="mono"><span class="pill ${d.z_score < -1 ? 'pill-green' : ''}">${d.z_score.toFixed(2)}</span></td>
                    <td class="mono">${d.rs_rating || '-'}</td>
                    <td class="mono">${d.volume_pct ? d.volume_pct.toFixed(1) + '%' : '-'}</td>
                    <td>${d.above_50ma ? '✅' : '❌'}</td>
                    <td>${d.above_200ma ? '✅' : '❌'}</td>
                    <td class="mono">$${d.year_high.toFixed(2)}</td>
                    <td class="mono">$${d.year_low.toFixed(2)}</td>
                    <td class="mono" style="color: var(--amber)">${d.dist_from_high.toFixed(1)}%</td>
                    <td class="mono" style="color: var(--green); font-weight: 600;">+${(d.gain_pct || 0).toFixed(2)}%</td>
                </tr>
            `).join('');
        }

        zMinInput.addEventListener('input', applyFilters);
        rsMinInput.addEventListener('input', applyFilters);

        loadData();
    </script>
</body>
</html>
