<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Z-Score Recovery Screener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
        /* CSS variables and styles kept from your original for brevity */
        :root {
            --bg: #F4F1EA; --bg2: #EDEAE0; --surface: #FFFFFF; --surface2: #FAF9F6;
            --border: #DDD9CE; --border2: #C9C4B8; --text: #1C1917; --text2: #57534E;
            --green: #0A6B42; --navy: #1E2E4A; --font-sans: 'DM Sans', sans-serif;
        }
        body { font-family: var(--font-sans); background: var(--bg); color: var(--text); margin: 0; }
        .site-header { background: var(--navy); padding: 0 32px; border-bottom: 3px solid var(--green); display: flex; align-items: center; height: 56px; color: white; position: sticky; top: 0; z-index: 100; }
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        .filter-bar { background: var(--surface); border: 1px solid var(--border); padding: 16px; display: flex; gap: 20px; align-items: flex-end; margin-bottom: 24px; border-radius: 8px; flex-wrap: wrap; }
        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        .filter-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text2); font-weight: 600; }
        .select-box, .search-input { padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface2); font-size: 13px; min-width: 160px; }
        table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        th { background: var(--surface2); padding: 12px; text-align: left; border-bottom: 2px solid var(--border); font-size: 12px; text-transform: uppercase; color: var(--text2); }
        td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(244,241,234,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; font-weight: bold; }
        a { color: var(--green); text-decoration: none; font-weight: 600; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<header class="site-header">
    <div class="brand"><strong>Z-SCORE</strong> SCREENER</div>
</header>

<div class="container">
    <div class="filter-bar">
        <div class="filter-group">
            <span class="filter-label">History Archive</span>
            <select class="select-box" id="history-select">
                <option value="live">Latest (Live)</option>
            </select>
        </div>

        <div class="filter-group">
            <span class="filter-label">Search Ticker</span>
            <input type="text" id="search-input" class="search-input" placeholder="e.g. AAPL">
        </div>

        <div class="filter-group">
            <span class="filter-label">Sector</span>
            <select id="sector-filter" class="select-box">
                <option value="all">All Sectors</option>
            </select>
        </div>
    </div>

    <div id="stats-summary" style="margin-bottom: 20px; font-weight: bold;"></div>

    <table id="results-table">
        <thead>
            <tr>
                <th>Ticker</th>
                <th>Price</th>
                <th>Z-Score</th>
                <th>RSI</th>
                <th>Sector</th>
            </tr>
        </thead>
        <tbody id="table-body">
            </tbody>
    </table>
</div>

<div id="loading" class="loading-overlay">LOADING DATA...</div>

<script>
    let allData = [];

    // Helper for Finviz Links
    function finvizUrl(t) {
        return `https://finviz.com/quote.ashx?t=${encodeURIComponent(t)}`;
    }

    // 1. Load the list of past scans
    async function loadHistoryManifest() {
        try {
            const res = await fetch('data/history_manifest.json');
            if (!res.ok) return;
            const files = await res.json();
            const select = document.getElementById('history-select');
            
            // Files are named scan_YYYY-MM-DD.json
            files.forEach(file => {
                const date = file.replace('scan_', '').replace('.json', '');
                const opt = document.createElement('option');
                opt.value = `data/history/${file}`;
                opt.textContent = date;
                select.appendChild(opt);
            });
        } catch (e) {
            console.log("Manifest not found yet.");
        }
    }

    // 2. Load data from a specific file
    async function loadData(path = 'data/screener_results.json') {
        const loader = document.getElementById('loading');
        loader.style.display = 'flex';

        try {
            const res = await fetch(`${path}?t=${Date.now()}`);
            const json = await res.json();
            allData = json.results || [];
            
            document.getElementById('stats-summary').textContent = 
                `Showing ${allData.length} symbols from ${path === 'data/screener_results.json' ? 'Latest Scan' : 'Archive'}`;
            
            renderTable(allData);
        } catch (e) {
            console.error("Error loading data", e);
        } finally {
            loader.style.display = 'none';
        }
    }

    function renderTable(data) {
        const body = document.getElementById('table-body');
        body.innerHTML = data.map(r => `
            <tr>
                <td><a href="${finvizUrl(r.ticker)}" target="_blank">${r.ticker}</a></td>
                <td>$${r.close}</td>
                <td>${r.zscore}</td>
                <td>${r.rsi}</td>
                <td>${r.sector}</td>
            </tr>
        `).join('');
    }

    // 3. Event Listeners
    document.getElementById('history-select').addEventListener('change', (e) => {
        const path = e.target.value === 'live' ? 'data/screener_results.json' : e.target.value;
        loadData(path);
    });

    document.getElementById('search-input').addEventListener('input', (e) => {
        const val = e.target.value.toUpperCase();
        const filtered = allData.filter(r => r.ticker.includes(val));
        renderTable(filtered);
    });

    // Initialize
    loadHistoryManifest();
    loadData();
</script>

</body>
</html>
